buildscript {
repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        maven { url = 'https://maven.parchmentmc.org' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        maven {
            // 阿里云镜像，方便国内开发
            url = uri("https://maven.aliyun.com/repository/public/")
        }
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '[6.0.16,6.2)', changing: true
        classpath 'org.parchmentmc:librarian:1.+'
        classpath group: 'org.spongepowered', name: 'mixingradle', version: '0.7-SNAPSHOT'
        classpath 'gradle.plugin.com.github.johnrengelman:shadow:7.1.2'
    }
}

apply plugin: 'eclipse'
apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'org.parchmentmc.librarian.forgegradle'
apply plugin: 'org.spongepowered.mixin'
apply plugin: 'java'
apply plugin: 'idea'
apply plugin: 'com.github.johnrengelman.shadow'

version = mod_version
group = mod_group_id
archivesBaseName = 'tlm_statue_animation'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'parchment', version: parchment_version
    runs {
        configureEach {
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            // 让 mods 文件夹中的 SRG 版前置 mod（TLM/YSM）的 mixin refmap 能映射到开发环境命名
            //（与 TLM 自身 build.gradle 的 run 配置一致；缺这两行会报 "could not find any targets"）
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                tlm_statue_animation {
                    source sourceSets.main
                }
            }
        }

        client {
            workingDirectory project.file('run/client')
            property 'fml.earlyprogresswindow', 'false'
        }

        server {
            workingDirectory project.file('run/server')
        }
    }
}

mixin {
    add sourceSets.main, "tlm_statue_animation.refmap.json"
    config "tlm_statue_animation.mixins.json"
}

configurations {
    // 自定义一个 mcLib，挂到 minecraftLibrary 上，方便引入需要 Shadow 进最终 jar 的库
    mcLib
    minecraftLibrary {
        extendsFrom mcLib
    }
}

repositories {
    // 本地 libs 文件夹：前置 mod 的 jar（TLM 必需、YSM 仅供编译期引用）
    // 注意：YSM 2.x 为闭源 Mod，无公开 Maven 坐标，故一律走本地 jar；
    // 运行时调试（runClient）需要把 TLM/YSM 的 jar 放入 run/client/mods。
    flatDir {
        dir 'libs'
    }
    maven {
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
    // 阿里云镜像（国内可达）+ mavenCentral：解析 io.airlift:aircompressor 等普通依赖
    maven {
        url = uri("https://maven.aliyun.com/repository/public/")
    }
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${forge_version}"

    // 前置：车万女仆（仅编译期；运行时以 SRG 版 release jar 放入 run/client/mods，
    // 避免 deobf 上 classpath 时 TLM 自带的 mixin refmap 在开发环境失配——该问题实测发生，
    // 见 docs/TLM-YSM-Linkage-Principle.md §8.4）
    compileOnly fg.deobf("libs:touhoulittlemaid:${tlm_version}")

    // Yes Steve Model 2.x 官方 jar 经 ProGuard 混淆（类名全部 O/0 化），无法编译期引用其类。
    // 本附属 mod 对 YSM 零编译依赖，运行时是否装载由 mods.toml 的 mandatory 依赖声明保证；
    // 开发调试（runClient）需把 ysm-2.6.5-forge+mc1.20.1.jar 放入 run/client/mods（libs/ 中已备）。

    // 酒狐更多动画（可选软联动）：开源未混淆，编译期引用其 MaidAnimationData 等公开 API；
    // 运行时缺席时所有引用点都在 MoreAnimationCompat.isLoaded() 门控之后，不会类加载。
    compileOnly fg.deobf("libs:moreanimation:1.20.1-forge-1.1.0")

    // 纯 Java zstd 解压（.ysm 模型解密后用），Shadow 进最终 jar 并 relocate。
    // 注：Maven Central 上 zstd 的纯 Java 实现坐标是 io.airlift:aircompressor
    //（io.airlift:zstd 不存在），包名 io.airlift.compress.zstd。
    mcLib "io.airlift:aircompressor:0.27"

    // 单元测试（JUnit 5）
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

// 让单元测试能访问 Minecraft/Forge/前置 mod 的类（如 CompoundTag、BlockPos）
sourceSets {
    test {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

test {
    useJUnitPlatform()
}

// 替换 mods.toml 中的 ${file.jarVersion} 占位符
processResources {
    filesMatching('META-INF/mods.toml') {
        expand 'version': project.version
    }
}

jar {
    manifest {
        attributes([
                "Specification-Title"   : mod_id,
                "Specification-Version" : "1",
                "Implementation-Title"  : mod_name,
                "Implementation-Version": "${version}",
                "Implementation-Vendor" : mod_group_id
        ])
    }
}

// 主产物：含 mcLib 依赖（aircompressor）的 shadowJar，io.airlift 重定位防冲突
shadowJar {
    configurations = [project.configurations.mcLib]

    relocate 'io.airlift', 'com.tlmstatueanimation.libs.airlift'

    mergeServiceFiles()
}

reobf {
    shadowJar {}
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
