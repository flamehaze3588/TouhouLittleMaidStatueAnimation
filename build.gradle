buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        maven { url = 'https://maven.parchmentmc.org' }
        maven {
            // 阿里云镜像，方便国内开发
            url = uri("https://maven.aliyun.com/repository/public/")
        }
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '[6.0.16,6.2)', changing: true
        classpath 'org.parchmentmc:librarian:1.+'
    }
}

apply plugin: 'eclipse'
apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'org.parchmentmc.librarian.forgegradle'
apply plugin: 'java'
apply plugin: 'idea'

version = mod_version
group = mod_group_id
archivesBaseName = 'tlm_statue_animation'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'parchment', version: parchment_version
    runs {
        configureEach {
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                tlm_statue_animation {
                    source sourceSets.main
                }
            }
        }

        client {
            workingDirectory project.file('run/client')
            property 'fml.earlyprogresswindow', 'false'
        }

        server {
            workingDirectory project.file('run/server')
        }
    }
}

repositories {
    // 优先本地 libs 文件夹（可放入 YSM 2.x 等无 Maven 坐标的 jar，仅供开发运行调试用）
    flatDir {
        dir 'libs'
    }
    maven {
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${forge_version}"

    // 前置：车万女仆（编译 + 运行时）
    implementation fg.deobf("maven.modrinth:touhou-little-maid:${tlm_version}")

    // 注意：YSM 2.x（yes_steve_model）为闭源 Mod，无公开 Maven 坐标。
    // 本附属 mod 对 YSM 零编译依赖（照抄 TLM 的软联动设计）；
    // 开发调试运行时需要手动把 YSM 2.3.3+ 的 jar 放入 run/client/mods。
}

jar {
    manifest {
        attributes([
                "Specification-Title"   : mod_id,
                "Specification-Version" : "1",
                "Implementation-Title"  : mod_name,
                "Implementation-Version": "${version}",
                "Implementation-Vendor" : mod_group_id
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
