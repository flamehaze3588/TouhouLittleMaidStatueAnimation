buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        maven { url = 'https://maven.parchmentmc.org' }
        maven {
            // 阿里云镜像，方便国内开发
            url = uri("https://maven.aliyun.com/repository/public/")
        }
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '[6.0.16,6.2)', changing: true
        classpath 'org.parchmentmc:librarian:1.+'
    }
}

apply plugin: 'eclipse'
apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'org.parchmentmc.librarian.forgegradle'
apply plugin: 'java'
apply plugin: 'idea'

version = mod_version
group = mod_group_id
archivesBaseName = 'tlm_statue_animation'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'parchment', version: parchment_version
    runs {
        configureEach {
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                tlm_statue_animation {
                    source sourceSets.main
                }
            }
        }

        client {
            workingDirectory project.file('run/client')
            property 'fml.earlyprogresswindow', 'false'
        }

        server {
            workingDirectory project.file('run/server')
        }
    }
}

repositories {
    // 本地 libs 文件夹：前置 mod 的 jar（TLM 必需、YSM 仅供编译期引用）
    // 注意：YSM 2.x 为闭源 Mod，无公开 Maven 坐标，故一律走本地 jar；
    // 运行时调试（runClient）需要把 TLM/YSM 的 jar 放入 run/client/mods。
    flatDir {
        dir 'libs'
    }
    maven {
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${forge_version}"

    // 前置：车万女仆（编译 + 运行时）
    implementation fg.deobf("libs:touhoulittlemaid:${tlm_version}")

    // 注意：Yes Steve Model 2.x 官方 jar 经 ProGuard 混淆（类名全部 O/0 化），无法编译期引用其类。
    // 本附属 mod 对 YSM 零编译依赖，运行时是否装载由 mods.toml 的 mandatory 依赖声明保证；
    // 开发调试（runClient）需把 ysm-2.6.5-forge+mc1.20.1.jar 放入 run/client/mods（libs/ 中已备）。

    // 单元测试（JUnit 5）
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// 让单元测试能访问 Minecraft/Forge/前置 mod 的类（如 CompoundTag、BlockPos）
sourceSets {
    test {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

test {
    useJUnitPlatform()
}

jar {
    manifest {
        attributes([
                "Specification-Title"   : mod_id,
                "Specification-Version" : "1",
                "Implementation-Title"  : mod_name,
                "Implementation-Version": "${version}",
                "Implementation-Vendor" : mod_group_id
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
